syntax = "proto3";
package Protocol;

message LimitSharing {
     bool sharingLimited = 1;
     TriggerType trigger = 2;
     int64 limitSharingSettingTimestamp = 3;
     bool initiatedByMe = 4;
    enum TriggerType {
        UNKNOWN = 0;
        CHAT_SETTING = 1;
        BIZ_SUPPORTS_FB_HOSTING = 2;
        UNKNOWN_GROUP = 3;
    }
}

message MessageKey {
     string remoteJid = 1;
     bool fromMe = 2;
     string id = 3;
     string participant = 4;
}