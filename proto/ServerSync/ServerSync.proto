syntax = "proto3";
package ServerSync;

message SyncdPatch {
     SyncdVersion version = 1;
    repeated SyncdMutation mutations = 2;
     ExternalBlobReference externalMutations = 3;
     bytes snapshotMac = 4;
     bytes patchMac = 5;
     KeyId keyId = 6;
     ExitCode exitCode = 7;
     uint32 deviceIndex = 8;
     bytes clientDebugData = 9;
}

message SyncdMutation {
     SyncdOperation operation = 1;
     SyncdRecord record = 2;
    enum SyncdOperation {
        SET = 0;
        REMOVE = 1;
    }
}

message SyncdMutations {
    repeated SyncdMutation mutations = 1;
}

message SyncdSnapshot {
     SyncdVersion version = 1;
    repeated SyncdRecord records = 2;
     bytes mac = 3;
     KeyId keyId = 4;
}

message ExternalBlobReference {
     bytes mediaKey = 1;
     string directPath = 2;
     string handle = 3;
     uint64 fileSizeBytes = 4;
     bytes fileSha256 = 5;
     bytes fileEncSha256 = 6;
}

message SyncdRecord {
     SyncdIndex index = 1;
     SyncdValue value = 2;
     KeyId keyId = 3;
}

message KeyId {
     bytes id = 1;
}

message SyncdValue {
     bytes blob = 1;
}

message SyncdIndex {
     bytes blob = 1;
}

message ExitCode {
     uint64 code = 1;
     string text = 2;
}

message SyncdVersion {
     uint64 version = 1;
}