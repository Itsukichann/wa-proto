    message SettingsSyncAction {
         bool startAtLogin = 1;
         bool minimizeToTray = 2;
         string language = 3;
         bool replaceTextWithEmoji = 4;
         DisplayMode bannerNotificationDisplayMode = 5;
         DisplayMode unreadCounterBadgeDisplayMode = 6;
         bool isMessagesNotificationEnabled = 7;
         bool isCallsNotificationEnabled = 8;
         bool isReactionsNotificationEnabled = 9;
         bool isStatusReactionsNotificationEnabled = 10;
         bool isTextPreviewForNotificationEnabled = 11;
         int32 defaultNotificationToneId = 12;
         int32 groupDefaultNotificationToneId = 13;
         int32 appTheme = 14;
         int32 wallpaperId = 15;
         bool isDoodleWallpaperEnabled = 16;
         int32 fontSize = 17;
         bool isPhotosAutodownloadEnabled = 18;
         bool isAudiosAutodownloadEnabled = 19;
         bool isVideosAutodownloadEnabled = 20;
         bool isDocumentsAutodownloadEnabled = 21;
         bool disableLinkPreviews = 22;
         int32 notificationToneId = 23;
        enum DisplayMode {
            DISPLAY_MODE_UNKNOWN = 0;
            ALWAYS = 1;
            NEVER = 2;
            ONLY_WHEN_APP_IS_OPEN = 3;
        }
        enum SettingKey {
            SETTING_KEY_UNKNOWN = 0;
            START_AT_LOGIN = 1;
            MINIMIZE_TO_TRAY = 2;
            LANGUAGE = 3;
            REPLACE_TEXT_WITH_EMOJI = 4;
            BANNER_NOTIFICATION_DISPLAY_MODE = 5;
            UNREAD_COUNTER_BADGE_DISPLAY_MODE = 6;
            IS_MESSAGES_NOTIFICATION_ENABLED = 7;
            IS_CALLS_NOTIFICATION_ENABLED = 8;
            IS_REACTIONS_NOTIFICATION_ENABLED = 9;
            IS_STATUS_REACTIONS_NOTIFICATION_ENABLED = 10;
            IS_TEXT_PREVIEW_FOR_NOTIFICATION_ENABLED = 11;
            DEFAULT_NOTIFICATION_TONE_ID = 12;
            GROUP_DEFAULT_NOTIFICATION_TONE_ID = 13;
            APP_THEME = 14;
            WALLPAPER_ID = 15;
            IS_DOODLE_WALLPAPER_ENABLED = 16;
            FONT_SIZE = 17;
            IS_PHOTOS_AUTODOWNLOAD_ENABLED = 18;
            IS_AUDIOS_AUTODOWNLOAD_ENABLED = 19;
            IS_VIDEOS_AUTODOWNLOAD_ENABLED = 20;
            IS_DOCUMENTS_AUTODOWNLOAD_ENABLED = 21;
            DISABLE_LINK_PREVIEWS = 22;
            NOTIFICATION_TONE_ID = 23;
        }
        enum SettingPlatform {
            PLATFORM_UNKNOWN = 0;
            WEB = 1;
            HYBRID = 2;
            WINDOWS = 3;
            MAC = 4;
        }
    }
    message StarAction {
         bool starred = 1;
    }
    message StatusPostOptInNotificationPreferencesAction {
         bool enabled = 1;
    }
    message StatusPrivacyAction {
         StatusDistributionMode mode = 1;
        repeated string userJid = 2;
        enum StatusDistributionMode {
            ALLOW_LIST = 0;
            DENY_LIST = 1;
            CONTACTS = 2;
            CLOSE_FRIENDS = 3;
        }
    }
    message StickerAction {
         string url = 1;
         bytes fileEncSha256 = 2;
         bytes mediaKey = 3;
         string mimetype = 4;
         uint32 height = 5;
         uint32 width = 6;
         string directPath = 7;
         uint64 fileLength = 8;
         bool isFavorite = 9;
         uint32 deviceIdHint = 10;
         bool isLottie = 11;
         string imageHash = 12;
         bool isAvatarSticker = 13;
    }
    message SubscriptionAction {
         bool isDeactivated = 1;
         bool isAutoRenewing = 2;
         int64 expirationDate = 3;
    }
    message SyncActionMessage {
         Protocol.MessageKey key = 1;
         int64 timestamp = 2;
    }
    message SyncActionMessageRange {
         int64 lastMessageTimestamp = 1;
         int64 lastSystemMessageTimestamp = 2;
        repeated SyncActionValue.SyncActionMessage messages = 3;
    }
    message TimeFormatAction {
         bool isTwentyFourHourFormatEnabled = 1;
    }
    message UGCBot {
         bytes definition = 1;
    }
    message UnarchiveChatsSetting {
         bool unarchiveChats = 1;
    }
    message UserStatusMuteAction {
         bool muted = 1;
    }
    message UsernameChatStartModeAction {
         ChatStartMode chatStartMode = 1;
        enum ChatStartMode {
            LID = 1;
            PN = 2;
        }
    }
    message WaffleAccountLinkStateAction {
         AccountLinkState linkState = 2;
        enum AccountLinkState {
            ACTIVE = 0;
            PAUSED = 1;
            UNLINKED = 2;
        }
    }
    message WamoUserIdentifierAction {
         string identifier = 1;
    }
}

message CallLogRecord {
     CallResult callResult = 1;
     bool isDndMode = 2;
     SilenceReason silenceReason = 3;
     int64 duration = 4;
     int64 startTime = 5;
     bool isIncoming = 6;
     bool isVideo = 7;
     bool isCallLink = 8;
     string callLinkToken = 9;
     string scheduledCallId = 10;
     string callId = 11;
     string callCreatorJid = 12;
     string groupJid = 13;
    repeated ParticipantInfo participants = 14;
     CallType callType = 15;
    enum CallResult {
        CONNECTED = 0;
        REJECTED = 1;
        CANCELLED = 2;
        ACCEPTEDELSEWHERE = 3;
        MISSED = 4;
        INVALID = 5;
        UNAVAILABLE = 6;
        UPCOMING = 7;
        FAILED = 8;
        ABANDONED = 9;
        ONGOING = 10;
    }
    enum CallType {
        REGULAR = 0;
        SCHEDULED_CALL = 1;
        VOICE_CHAT = 2;
    }
    message ParticipantInfo {
         string userJid = 1;
         CallLogRecord.CallResult callResult = 2;
    }
    enum SilenceReason {
        NONE = 0;
        SCHEDULED = 1;
        PRIVACY = 2;
        LIGHTWEIGHT = 3;
    }
}

message RecentEmojiWeight {
     string emoji = 1;
     float weight = 2;
}

