syntax = "proto3";
package MmsRetry;

message ServerErrorReceipt {
     string stanzaId = 1;
}

message MediaRetryNotification {
     string stanzaId = 1;
     string directPath = 2;
     ResultType result = 3;
     bytes messageSecret = 4;
    enum ResultType {
        GENERAL_ERROR = 0;
        SUCCESS = 1;
        NOT_FOUND = 2;
        DECRYPTION_ERROR = 3;
    }
}